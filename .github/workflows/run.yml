name: Cloud check in action
on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    steps:
      - name: random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm

      - name: Check if Debug is true
        if: vars.debug == '1'
        run: echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: Init dependencies
        run: npm install

      - name: Run
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 }}
          TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 }}
          TY_USERNAME_2: ${{ secrets.TY_USERNAME_2 }}
          TY_PASSWORD_2: ${{ secrets.TY_PASSWORD_2 }}
          TY_USERNAME_3: ${{ secrets.TY_USERNAME_3 }}
          TY_PASSWORD_3: ${{ secrets.TY_PASSWORD_3 }}
          TY_USERNAME_4: ${{ secrets.TY_USERNAME_4 }}
          TY_PASSWORD_4: ${{ secrets.TY_PASSWORD_4 }}
          TY_USERNAME_5: ${{ secrets.TY_USERNAME_5 }}
          TY_PASSWORD_5: ${{ secrets.TY_PASSWORD_5 }}
          TY_USERNAME_6: ${{ secrets.TY_USERNAME_6 }}
          TY_PASSWORD_6: ${{ secrets.TY_PASSWORD_6 }}
          TY_USERNAME_7: ${{ secrets.TY_USERNAME_7 }}
          TY_PASSWORD_7: ${{ secrets.TY_PASSWORD_7 }}
          TY_USERNAME_8: ${{ secrets.TY_USERNAME_8 }}
          TY_PASSWORD_8: ${{ secrets.TY_PASSWORD_8 }}
          TY_USERNAME_9: ${{ secrets.TY_USERNAME_9 }}
          TY_PASSWORD_9: ${{ secrets.TY_PASSWORD_9 }}
          TY_USERNAME_10: ${{ secrets.TY_USERNAME_10 }}
          TY_PASSWORD_10: ${{ secrets.TY_PASSWORD_10 }}
          SENDKEY: ${{ secrets.SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          WECOM_BOT_TELPHONE: ${{ secrets.WECOM_BOT_TELPHONE }}
          WX_PUSHER_APP_TOKEN: ${{ secrets.WX_PUSHER_APP_TOKEN }}
          WX_PUSHER_UID: ${{ secrets.WX_PUSHER_UID }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          WPUSH_APIKEY: ${{ secrets.WPUSH_APIKEY }}
          WPUSH_CHANNEL: ${{ secrets.WPUSH_CHANNEL }}
          WPUSH_TOPIC_CODE: ${{ secrets.WPUSH_TOPIC_CODE }}
          SHOWDOC_KEY: ${{ secrets.SHOWDOC_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          for attempt in 1 2 3; do
            if npm start; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm start failed (attempt $attempt/3), retrying..."
              sleep 5
            fi
          done
          exit 1

      - name: Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV

      - name: Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}

      - name: Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      - name: Delete old workflow run
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
